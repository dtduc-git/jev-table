name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # jevassert (pack loader) is resolved from PyPI; local dev uses the
      # sibling checkout via [tool.uv.sources].
      - run: uv sync --all-groups --no-sources
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Dry-run self-check (no key, sends nothing)
        run: >-
          uv run jev-table examples/sms-triage/sample.csv
          --spec examples/sms-triage/pack.yaml --dry-run
